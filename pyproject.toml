[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot-fastapi"
version = "0.1.0"
description = "A website chatbot service that answers only from the site's own content: FastAPI, Postgres with pgvector, hybrid retrieval, citations, prompt-injection defences, cost accounting and a drop-in widget."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kien Phan" }]
keywords = ["rag", "chatbot", "fastapi", "pgvector", "postgres", "supabase", "prompt-injection", "retrieval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# The top-level runtime packages, exact pins. Their pinned, hash-checked closure is requirements.txt (see
# requirements.in); a test keeps the two in step. Each one is justified in the README.
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "psycopg-pool==3.3.3",
]

[project.scripts]
rag-chatbot = "rag_chatbot.composition.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_chatbot = ["py.typed"]
"rag_chatbot.widget" = ["rag-chat.js"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --strict-markers --strict-config --import-mode=importlib"
markers = [
  "db: needs the throwaway Postgres + pgvector container (scripts/py.sh with PY_DB=1)",
  "slow: starts a real server process",
]
filterwarnings = ["error"]
# The suite's only wall-clock limit, and a generous one: a test that takes five minutes is stuck, not slow.
# pytest dumps every thread's traceback and exits, so a wedge fails with a stack instead of a cancelled CI job.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["rag_chatbot"]
branch = true
data_file = "out/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "\\.\\.\\.$",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "eval"]
warn_unreachable = true
warn_unused_ignores = false
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
explicit_package_bases = true
mypy_path = "src:tests"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "PL", "TRY", "PERF", "A", "ARG", "RET", "ASYNC"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "SIM102", "SIM108", "PLR0917", "RUF036", "TRY004", "PT018", "PERF401", "PERF203", "RET504", "E501",  # size/complexity limits are a review matter here
  "TRY003", "TRY300", "TRY301",
  "S101",                                                  # assert is how the tests are written
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLC0415", "RUF012", "PT011", "PT012", "PT018", "RUF001", "A002", "ASYNC"]
"scripts/**" = ["S603", "S607", "S310", "PLC0415"]
"eval/**" = ["S", "PLC0415"]
